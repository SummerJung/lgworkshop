<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>고객 피드백 보드</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --star: #f59e0b;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 32px 16px;
    }

    .container { max-width: 720px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 32px; }
    header h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
    header p { color: var(--muted); margin-top: 8px; font-size: 1rem; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 24px;
    }

    form .field { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }
    textarea { resize: vertical; min-height: 90px; }

    /* Star rating */
    .stars {
      display: inline-flex;
      flex-direction: row-reverse;
      gap: 4px;
    }
    .stars input { display: none; }
    .stars label {
      font-size: 1.8rem;
      color: var(--border);
      cursor: pointer;
      margin: 0;
      transition: color 0.15s, transform 0.1s;
      line-height: 1;
    }
    .stars label:hover { transform: scale(1.15); }
    .stars input:checked ~ label,
    .stars label:hover,
    .stars label:hover ~ label { color: var(--star); }

    button {
      width: 100%;
      padding: 13px 16px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }
    button:hover { background: var(--primary-dark); }
    button:active { transform: translateY(1px); }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 36px 4px 16px;
    }
    .list-header h2 { font-size: 1.2rem; font-weight: 700; }
    .count {
      font-size: 0.8rem;
      color: var(--muted);
      background: #eef0f6;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .feedback-list { display: flex; flex-direction: column; gap: 14px; }

    .feedback-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 18px 20px;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .feedback-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 12px;
    }
    .feedback-name { font-weight: 700; font-size: 1rem; }
    .feedback-stars { color: var(--star); font-size: 1rem; letter-spacing: 1px; }
    .feedback-message {
      color: var(--text);
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .feedback-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
    }
    .feedback-date { font-size: 0.78rem; color: var(--muted); }
    .delete-btn {
      width: auto;
      padding: 4px 10px;
      font-size: 0.78rem;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .delete-btn:hover { background: #fee2e2; color: #dc2626; border-color: #fecaca; }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 32px 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>💬 고객 피드백 보드</h1>
      <p>서비스 이용 경험을 남겨주세요. 여러분의 의견이 더 나은 제품을 만듭니다.</p>
    </header>

    <div class="card">
      <form id="feedback-form">
        <div class="field">
          <label for="name">이름</label>
          <input type="text" id="name" name="name" placeholder="이름을 입력하세요" required />
        </div>

        <div class="field">
          <label>별점</label>
          <div class="stars">
            <input type="radio" id="star5" name="rating" value="5" /><label for="star5" title="5점">★</label>
            <input type="radio" id="star4" name="rating" value="4" /><label for="star4" title="4점">★</label>
            <input type="radio" id="star3" name="rating" value="3" /><label for="star3" title="3점">★</label>
            <input type="radio" id="star2" name="rating" value="2" /><label for="star2" title="2점">★</label>
            <input type="radio" id="star1" name="rating" value="1" /><label for="star1" title="1점">★</label>
          </div>
        </div>

        <div class="field">
          <label for="message">메시지</label>
          <textarea id="message" name="message" placeholder="피드백 내용을 작성해주세요" required></textarea>
        </div>

        <button type="submit">피드백 제출</button>
      </form>
    </div>

    <div class="list-header">
      <h2>받은 피드백</h2>
      <span class="count" id="count">0개</span>
    </div>

    <div class="feedback-list" id="feedback-list"></div>
  </div>

  <script>
    const STORAGE_KEY = "customer-feedback";
    const form = document.getElementById("feedback-form");
    const listEl = document.getElementById("feedback-list");
    const countEl = document.getElementById("count");

    function load() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function save(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function formatDate(ts) {
      const d = new Date(ts);
      return d.toLocaleString("ko-KR", {
        year: "numeric", month: "long", day: "numeric",
        hour: "2-digit", minute: "2-digit",
      });
    }

    function render() {
      const items = load();
      countEl.textContent = items.length + "개";

      if (items.length === 0) {
        listEl.innerHTML =
          '<div class="empty">아직 등록된 피드백이 없습니다. 첫 번째 피드백을 남겨보세요! ✨</div>';
        return;
      }

      listEl.innerHTML = items
        .map(function (item) {
          const stars =
            "★".repeat(item.rating) + "☆".repeat(5 - item.rating);
          return (
            '<div class="feedback-card">' +
              '<div class="feedback-top">' +
                '<span class="feedback-name">' + escapeHtml(item.name) + "</span>" +
                '<span class="feedback-stars">' + stars + "</span>" +
              "</div>" +
              '<div class="feedback-message">' + escapeHtml(item.message) + "</div>" +
              '<div class="feedback-meta">' +
                '<span class="feedback-date">' + formatDate(item.createdAt) + "</span>" +
                '<button class="delete-btn" data-id="' + item.id + '">삭제</button>' +
              "</div>" +
            "</div>"
          );
        })
        .join("");
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const message = document.getElementById("message").value.trim();
      const ratingEl = form.querySelector('input[name="rating"]:checked');

      if (!name || !message) return;
      if (!ratingEl) {
        alert("별점을 선택해주세요.");
        return;
      }

      const items = load();
      items.unshift({
        id: Date.now().toString(),
        name: name,
        rating: parseInt(ratingEl.value, 10),
        message: message,
        createdAt: Date.now(),
      });
      save(items);
      render();
      form.reset();
    });

    listEl.addEventListener("click", function (e) {
      if (e.target.classList.contains("delete-btn")) {
        const id = e.target.getAttribute("data-id");
        const items = load().filter(function (item) {
          return item.id !== id;
        });
        save(items);
        render();
      }
    });

    render();
  </script>
</body>
</html>
